[workspace]
# Root-level workspace commands (test, clippy, ...) operate on the core crates;
# rln-cli and rln-wasm are built explicitly with -p or from their own directory.
members = ["rln", "utils", "rln-cli", "rln-wasm"]
default-members = ["rln", "utils"]
resolver = "2"

# Dependencies shared by two or more workspace members.
[workspace.dependencies]
rand = "0.8.7"
rayon = "1.12.0"
ark-ff = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
zeroize = "1.9.0"
ark-bn254 = { version = "0.5.0", features = ["std"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
thiserror = "2.0.18"
num-bigint = { version = "0.4.8", default-features = false }
num-traits = "0.2.19"
serde_json = "1.0.150"
ark-groth16 = { version = "0.5.0", default-features = false }
rand_chacha = "0.3.1"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
ark-relations = { version = "0.5.1", features = ["std"] }

# Compilation profile for any non-workspace member.
# Dependencies are optimized, even in a dev build.
# This improves dev performance while having negligible impact on incremental build times.
[profile.dev.package."*"]
opt-level = 3
